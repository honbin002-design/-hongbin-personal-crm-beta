name: HCMD External POST Transport Diagnostic

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/hcmd-external-selftest-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hcmd-post-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose HCMD anonymous POST transport
        shell: bash
        env:
          BASE: https://script.google.com/macros/s/AKfycbwSPyiUzAh2k3PLFnZCAnQfDh2YwWNEsQUziASOe-V6vGWrLH3fJ6jxKbMKSP6DH7dX/exec
        run: |
          set -euo pipefail
          echo '=== GET health through query route ==='
          curl -sS -L -D get-headers.txt "${BASE}?route=%2Fv1%2Fhealth" -o get-body.txt
          sed -n '1,20p' get-headers.txt
          head -c 500 get-body.txt; echo

          echo '=== POST unauthenticated through query route ==='
          printf '%s' '{"body":{}}' > post.json
          curl -sS -L -D post-headers.txt \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data-binary @post.json \
            "${BASE}?route=%2Fv1%2Fversion%2Fhead" -o post-body.txt
          sed -n '1,40p' post-headers.txt
          echo 'POST_BODY_BEGIN'
          head -c 1200 post-body.txt; echo
          echo 'POST_BODY_END'

          if grep -qi 'accounts.google.com' post-body.txt; then
            echo 'POST_TRANSPORT_RESULT=GOOGLE_SIGNIN_REDIRECT'
            exit 2
          fi
          if jq -e '.ok == false and .error' post-body.txt >/dev/null 2>&1; then
            echo 'POST_TRANSPORT_RESULT=HCMD_REACHED'
            exit 0
          fi
          echo 'POST_TRANSPORT_RESULT=UNKNOWN'
          exit 3

name: HCMD Runtime 10 ReadOnly Transport Verification

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/hcmd-external-selftest-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readonly-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public read-only transport and fail-closed writes
        shell: bash
        env:
          BASE: https://script.google.com/macros/s/AKfycbwSPyiUzAh2k3PLFnZCAnQfDh2YwWNEsQUziASOe-V6vGWrLH3fJ6jxKbMKSP6DH7dX/exec
        run: |
          set -euo pipefail

          echo '1/4 health GET'
          curl -fsSL --retry 2 --retry-delay 1 "${BASE}?route=%2Fv1%2Fhealth" -o health.json
          cat health.json; echo
          jq -e '.ok == true and .runtimeVersion == "1.0-runtime.10" and .masterWriteEnabled == false and .productionWriteReady == false and .integrationReady == false' health.json >/dev/null

          echo '2/4 unauthenticated signed-only route must block'
          printf '%s' '{"body":{}}' > packet.json
          curl -fsSL --retry 2 --retry-delay 1 -H 'Content-Type: text/plain;charset=UTF-8' --data-binary @packet.json "${BASE}?route=%2Fv1%2Fversion%2Fhead" -o unauth.json
          cat unauth.json; echo
          jq -e '.ok == false and .error and .masterWriteEnabled == false and .runtimeVersion == "1.0-runtime.10"' unauth.json >/dev/null

          echo '3/4 unauthenticated production write must block'
          printf '%s' '{"body":{"events":[]}}' > write.json
          curl -fsSL --retry 2 --retry-delay 1 -H 'Content-Type: text/plain;charset=UTF-8' --data-binary @write.json "${BASE}?route=%2Fv1%2Foutbox%2Fpush" -o write-block.json
          cat write-block.json; echo
          jq -e '.ok == false and .error and .masterWriteEnabled == false and .runtimeVersion == "1.0-runtime.10"' write-block.json >/dev/null

          echo '4/4 unsupported ACK route must remain fail-closed'
          curl -fsSL --retry 2 --retry-delay 1 -H 'Content-Type: text/plain;charset=UTF-8' --data-binary @packet.json "${BASE}?route=%2Fv1%2Fchanges%2Fack" -o ack-block.json
          cat ack-block.json; echo
          jq -e '.ok == false and .error and .masterWriteEnabled == false and .runtimeVersion == "1.0-runtime.10"' ack-block.json >/dev/null

          echo 'HCMD_RUNTIME_10_READONLY_TRANSPORT_PASS'

name: Firebase Notes Real Firestore Emulator Gate - no Work
on:
  push:
    branches:
      - probe/gas-no-work-20261019
    paths:
      - 'firebase-sync-probe/**'
      - '.github/workflows/firebase-notes-emulator-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase-sync-probe
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java for real Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Google Firebase emulator and test dependencies
        run: npm install --no-audit --no-fund
      - name: Validate iPhone Firebase Google sign-in test has no Firestore data writes
        run: npm run test:web
      - name: Validate Drive member identities from accepted invitations
        run: node firebase-drive-member-directory.test.mjs
      - name: Run real Firebase Firestore rules engine
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-honbin-crm-rules-isolated --non-interactive "npm run test:rules && node firestore.owner-allowlist-v2.test.mjs && node firestore.notebook-archive-v3.test.mjs && node firestore.notebook-hard-delete-v4.test.mjs && node firestore.notebook-hard-delete-v4c.test.mjs && node firestore.notebook-hard-delete-v4c-stress.test.mjs" 2>&1 | tee firebase-emulator-ci.log
      - name: Report real emulator result in GitHub commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$JOB_RESULT" == "success" ]]; then state=success; else state=failure; fi
          if [[ "$state" == "failure" ]]; then
            last=$(grep '^BEGIN ' firebase-emulator-ci.log 2>/dev/null | tail -1 | cut -c 1-100 || true)
            last=${last:-"Emulator setup or rules compilation"}
            failed_slug=$(printf '%s' "$last" | tr '[:upper:]' '[:lower:]' | sed -E 's/^begin //; s/[^a-z0-9]+/-/g; s/^-|-$//g' | cut -c1-45)
            failed_slug=${failed_slug:-"emulator-startup"}
            # Publish only non-sensitive error classifications from synthetic emulator,
            # never environment values, account data, tokens, or full raw logs.
            matched=$(grep -Ei 'error|failed|invalid|compil|unexpected|fatal|java' firebase-emulator-ci.log 2>/dev/null | tail -n 4 || true)
            if [[ -n "$matched" ]]; then
              j=0
              while IFS= read -r err; do
                j=$((j+1))
                slug=$(printf '%s' "$err" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g;s/^-|-$//g' | cut -c1-60)
                if [[ -n "$slug" ]]; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                    --field state=failure \
                    --field context="firebase-sync-probe/error-$j-$slug" \
                    --field description="Synthetic emulator error classification" >/dev/null
                fi
              done <<< "$matched"
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --field state=failure \
              --field context="firebase-sync-probe/failed-$failed_slug" \
              --field description="$last" >/dev/null
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --field state="$state" \
            --field context='firebase-sync-probe/rules-emulator' \
            --field description="Real Firestore emulator: $JOB_RESULT; no live deployment" >/dev/null
          echo "FIRESTORE_EMULATOR_RESULT=$state"
      - name: Confirm NO production or billing changes
        run: |
          echo 'FIREBASE_PRODUCTION_PROJECT_CREATED: NO'
          echo 'FIREBASE_LIVE_DEPLOYMENT: NOT_ATTEMPTED'
          echo 'FIREBASE_BILLING_UPGRADE: NO'
          echo 'CRM_MAIN_MODIFICATIONS: NONE'

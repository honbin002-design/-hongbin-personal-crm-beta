name: Assigned calendar candidate checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/calendar-assigned-tasks-v1.mjs
      - run: node tests/calendar-assigned-tasks-v1.mjs

      - run: node --check calendar-google-sync-ui.mjs

name: R74 Simple Core - isolated WebKit checks
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r74-simple-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Verify standalone five-module CRM using synthetic data
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/r74-simple.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          node tests/r74-simple-smoke.cjs

name: R74 isolated regression checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
concurrency:
  group: r74-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout R74 candidate
        uses: actions/checkout@v4
      - name: Run offline non-destructive regression suite
        run: node tests/r74-regression.cjs
      - name: Install browser for isolated mobile test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Run mobile WebKit smoke test on loopback only
        shell: bash
        run: |
          python3 -m py_compile .devcontainer/r74_server.py
          python3 .devcontainer/r74_server.py --port 8765 --bind 127.0.0.1 >/tmp/r74-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tests/r74-mobile-smoke.cjs

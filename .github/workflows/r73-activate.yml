name: R73 simplified seven-module release checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'simple-core.js'
      - 'quote-vector-pdf.js'
      - 'owner-prices.mjs'
      - 'tests/owner-price-validation.cjs'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/crm-push-receiver-preflight.cjs'
      - 'crm-push-setup.mjs'
      - 'push-public-config.json'
      - 'tests/crm-push-setup-preflight.mjs'
      - 'tests/r73-simple-acceptance.cjs'
      - '.github/workflows/r73-activate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: node --check simple-core.js && node --check quote-vector-pdf.js && node --check owner-prices.mjs && node --check sw.js && node --check crm-push-setup.mjs
      - name: Validate owner-only supplier price import (synthetic data only)
        run: node tests/owner-price-validation.cjs
      - name: Verify simplified homepage and old-data protection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('simple-core.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert '<title>鴻繽科技 CRM</title>' in html
          assert html.count('src="./simple-core.js?v=20261022-quote-note-scroll"') == 1
          assert 'src="./owner-prices.mjs?v=20261022"' in html
          assert 'id="ownerPricePanel"' in html
          assert '<script src="./r73-fixes.js' not in html
          assert '<script src="./r70-complete.js' not in html
          assert '雲端記事與任務' in html
          assert '雲端記事 TEST' not in html
          assert 'id="cloudNotebookEntry"' not in html
          assert '在完整畫面開啟記事 App' not in html
          assert 'navigator.serviceWorker.register' in html
          assert all(html.count('data-tab="'+n+'"') == 1 for n in ['quotes','customers','calendar','projects','suppliers','products','notes','backup'])
          assert 'const KEYS={master:' in js
          assert 'function restore()' in js
          assert 'function renderHistory(' in js
          assert 'function renderCalendar(' in js
          assert 'function saveQuote(' in js
          assert 'function pdfQuote(' in js
          assert 'html2canvas@' not in js
          assert 'quote-vector-pdf.js' in html
          assert 'HONBIN_CLOUD_NOTE_EDITOR' in js
          assert "['品名','品號','規格','單價 (NT)']" in Path('quote-vector-pdf.js').read_text(encoding='utf-8')
          assert 'quote-letterhead.jpg' in js
          assert 'q-mark' not in js
          assert "text(page,line,left,y,14)" in Path('quote-vector-pdf.js').read_text(encoding='utf-8')
          assert 'subset:false' in Path('quote-vector-pdf.js').read_text(encoding='utf-8')
          assert 'useObjectStreams:false' in Path('quote-vector-pdf.js').read_text(encoding='utf-8')
          assert 'right-measure(representative,repSize)' in Path('quote-vector-pdf.js').read_text(encoding='utf-8')
          assert 'hongbin-crm-r73-iphone-subscription-staging-20261022' in sw
          assert 'rel="manifest"' in html
          assert 'apple-mobile-web-app-capable' in html
          assert 'pushTab' in js
          assert 'id="pushHostButton"' in html
          assert 'crm-push-setup.mjs' in html
          assert Path('push-public-config.json').exists()
          assert "self.addEventListener('push'" in sw
          assert 'quote-letterhead.jpg' in sw
          assert 'simple-core.js' in sw
          assert 'withR73(' not in sw
          print('R73 simplified release safety checks PASS')
          PY
      - name: Verify main CRM push receiver, safe payload and scoped notification links
        run: node tests/crm-push-receiver-preflight.cjs && node tests/crm-push-setup-preflight.mjs
      - name: Prepare independent PDF glyph verification (free tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -fL --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/TC/NotoSansTC-Regular.otf' -o /tmp/honbin-print-font.otf
          test "$(wc -c </tmp/honbin-print-font.otf)" -gt 1000000
      - name: Install iPhone WebKit and PDF libraries
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1 @fontsource/noto-sans-tc@5.3.0
          npx playwright install --with-deps webkit chromium
      - name: Verify quote original layout, task time, Enter navigation, and seven modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/r73-simple-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          CRM_PRINT_TEST_FONT=/tmp/honbin-print-font.otf node tests/r73-simple-acceptance.cjs

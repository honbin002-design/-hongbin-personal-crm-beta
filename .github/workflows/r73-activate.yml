name: R73 simplified seven-module release checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'simple-core.js'
      - 'sw.js'
      - 'tests/r73-simple-acceptance.cjs'
      - '.github/workflows/r73-activate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: node --check simple-core.js && node --check sw.js
      - name: Verify simplified homepage and old-data protection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('simple-core.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert '<title>鴻繽科技 CRM｜R73 簡易版</title>' in html
          assert html.count('src="./simple-core.js?v=r73-readonly-details-back-v2-20261019"') == 1
          assert '<script src="./r73-fixes.js' not in html
          assert '<script src="./r70-complete.js' not in html
          assert 'navigator.serviceWorker.register' in html
          assert all(html.count('data-tab="'+n+'"') == 1 for n in ['quotes','customers','calendar','projects','suppliers','products','backup'])
          assert 'const KEYS={master:' in js
          assert 'function restore()' in js
          assert 'function renderHistory(' in js
          assert 'function renderCalendar(' in js
          assert 'function saveQuote(' in js
          assert 'function pdfQuote(' in js
          assert 'hongbin-crm-r73-readonly-details-back-v2-20261019' in sw
          assert 'simple-core.js' in sw
          assert 'withR73(' not in sw
          print('R73 simplified release safety checks PASS')
          PY
      - name: Install iPhone WebKit and PDF libraries
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 html2canvas@1.4.1 jspdf@2.5.1 pdf-lib@1.17.1
          npx playwright install --with-deps webkit chromium
      - name: Verify quote original layout, task time, Enter navigation, and seven modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/r73-simple-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          node tests/r73-simple-acceptance.cjs

name: GAS Notes Offline Safety Tests - no Work
on:
  push:
    branches:
      - probe/gas-no-work-20261019
    paths:
      - 'gas-sync-probe/**'
      - '.github/workflows/gas-notes-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic-user access and conflict tests
        run: node gas-sync-probe/note-rules.test.cjs
      - name: Confirm NO live deployment
        run: |
          echo 'LIVE_GOOGLE_LOGIN: NOT_TESTED'
          echo 'LIVE_APP_SCRIPT_DEPLOYMENT: NOT_TESTED'
          echo 'PRODUCTION_CRM_CHANGES: NONE'

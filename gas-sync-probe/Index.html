<!DOCTYPE html>
<html lang="zh-Hant">
<head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#193247;background:#f3f7fa}
*{box-sizing:border-box}
body{margin:0;padding:16px 16px calc(36px + env(safe-area-inset-bottom))}
main{max-width:650px;margin:auto}
h1{font-size:23px;margin:3px 0 8px}
p{line-height:1.6} .sub{color:#4e6070;font-size:14px}
.panel{background:white;border:1px solid #d5e2eb;border-radius:14px;padding:16px;margin-top:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
button{font:inherit;min-height:44px;border:0;border-radius:9px;padding:8px 15px;background:#135c8e;color:white}
button.secondary{background:#e5edf4;color:#193247}
button.active{background:#135c8e;color:white}
button:disabled{opacity:.55}
input,select,textarea{width:100%;font:inherit;font-size:16px;min-height:44px;padding:10px;border:1px solid #c4d2df;border-radius:7px}
textarea{min-height:185px;resize:vertical;line-height:1.5}
label{display:block;font-weight:600;margin:10px 0 5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
#editor[hidden]{display:none}
[hidden]{display:none!important}
.note button{margin-top:7px}
.warning{color:#973e21;font-weight:600}
.note .body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}

.note{border-top:1px solid #dbe7f0;padding:12px 0}
.note strong{display:block;font-size:16px}
#status{min-height:46px;padding:12px;border-radius:8px;background:#e8f0f6;white-space:pre-wrap}
</style></head>
<body><main>
<h1>同步記事｜隔離測試頁</h1>
<p class="sub">此頁只供經授權的測試環境使用。原本 CRM 隨手記不會自動上傳。</p>
<p class="sub" id="identity" aria-live="polite">正在確認 Google 登入帳號……</p>
<section class="panel">
<div class="tabs" role="tablist">
<button id="personal" class="active" type="button">私人記事</button>
<button id="team" class="secondary" type="button">共用記事</button>
</div>
<div id="groupSection" hidden><label for="groupId">選擇共用群組</label>
<select id="groupId" aria-label="已加入的共用群組"><option value="">載入已加入的群組中……</option></select></div>
<p id="status" role="status" aria-live="polite">尚未連接 Google 服務。</p>
<div class="actions">
<button id="refresh" type="button">重新讀取</button>
<button id="newNote" type="button" disabled>新增記事</button>
</div>
<section id="editor" class="panel" hidden aria-label="新增或編輯記事">
<strong id="editorTitle">新增記事</strong>
<label for="noteTitle">標題</label>
<input id="noteTitle" autocomplete="off" maxlength="120" placeholder="輸入標題">
<label for="noteContent">記事內容</label>
<textarea id="noteContent" maxlength="30000" placeholder="請輸入記事內容"></textarea>
<div class="actions">
<button id="saveNote" type="button">儲存至 Google</button>
<button id="cancelNote" class="secondary" type="button">取消</button>
<button id="deleteNote" class="secondary" type="button" hidden>刪除記事</button>
</div>
<p class="sub" id="draftWarning">尚未儲存至 Google 的文字，只保留在目前編輯畫面；離開前會提醒。</p>
</section>
<div id="items"></div>
</section></main>
<script>
(function(){
 'use strict';
 var scope='PRIVATE',running=false,account='',notes=[],groups=[],editing=null,activeGroup='',pendingSave=null,pendingDelete=null;
 var byId=function(id){return document.getElementById(id)};
 var status=function(message){byId('status').textContent=message};
 var groupRole=function(){
  var selected=byId('groupId').value;
  var g=groups.find(function(x){return String(x.groupId)===selected});
  return g?String(g.role):'NONE';
 };
 var canWrite=function(){
  return scope==='PRIVATE'||['ADMIN','EDITOR'].includes(groupRole());
 };
 var canDelete=function(){
  return scope==='PRIVATE'||groupRole()==='ADMIN';
 };
 var secureId=function(){
  var bytes=new Uint8Array(16);
  if(!window.crypto||typeof window.crypto.getRandomValues!=='function')
   throw Error('SECURE_RANDOM_UNAVAILABLE');
  window.crypto.getRandomValues(bytes);
  var out='';
  for(var i=0;i<bytes.length;i++)out+=bytes[i].toString(16).padStart(2,'0');
  return 'operation_'+out;
 };
 var remote=function(action,params,onSuccess,onFail){
  if(!account){status('Google 帳號尚未驗證，禁止同步。');return}
  if(!window.google||!google.script||!google.script.run){
   status('尚未部署，不能讀寫雲端記事。');return;
  }
  // All calls, including reads and group selection, are account-bound.
  var payload=Object.assign({},params||{});
  payload.__expectedGoogleAccount=account;
  google.script.run.withSuccessHandler(onSuccess)
   .withFailureHandler(onFail).gasNoteCall(action,payload);
 };
 var isDirty=function(){
  if(byId('editor').hidden)return false;
  return byId('noteTitle').value!==(editing?String(editing.title||''):'')||
   byId('noteContent').value!==(editing?String(editing.content||''):'');
 };
 var leaveEditor=function(){
  if(isDirty()&&!window.confirm('這則記事尚未儲存。確定放棄這次修改嗎？'))return false;
  closeEditor();return true;
 };
 var choose=function(s){
  if(running){status('請等待目前操作完成。');return}
  if(!leaveEditor())return;
  scope=s;
  byId('personal').className=s==='PRIVATE'?'active':'secondary';
  byId('team').className=s==='SHARED'?'active':'secondary';
  byId('groupSection').hidden=s==='PRIVATE';
  notes=[];byId('items').replaceChildren();byId('editor').hidden=true;editing=null;
  byId('newNote').disabled=!account||s==='SHARED';
  status(s==='PRIVATE'?'私人記事：尚未讀取':'共用記事：正在查詢你已加入的群組');
  if(s==='SHARED')loadGroups();
 };
 var loadGroups=function(){
  var select=byId('groupId');select.replaceChildren();
  if(!window.google||!google.script||!google.script.run){
   status('尚未部署至 Google Apps Script 測試環境');return
  }
  remote('LIST_GROUPS',{},function(received){
   groups=Array.isArray(received)?received:[];
   select.replaceChildren();
   if(!Array.isArray(groups)||!groups.length){
    var empty=document.createElement('option');empty.value='';empty.textContent='尚未加入共用群組';
    select.appendChild(empty);status('目前沒有已加入的共用記事群組。');return;
   }
   groups.forEach(function(g){
    var option=document.createElement('option');
    option.value=String(g.groupId||'');
    option.textContent=String(g.name||'未命名群組')+'（'+String(g.role||'成員')+'）';
    select.appendChild(option);
   });
   activeGroup=select.value;
   status('已取得 '+groups.length+' 個授權群組。');
   byId('newNote').disabled=!account||!canWrite();
   refresh();
  },function(err){
   status('群組讀取失敗：'+String(err&&err.message||'UNKNOWN_ERROR'));
  });
 };
 var dateText=function(value){
  if(!value)return '未記錄';
  var d=new Date(value);
  return isNaN(d.getTime())?'未記錄':d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
 };
 var showNotes=function(list){
  var root=byId('items');root.replaceChildren();
  if(!Array.isArray(list)){status('資料格式不正確，已停止顯示。');return}
  status('同步讀取成功：'+list.length+' 則');
  notes=list;
  byId('newNote').disabled=!account||!canWrite();
  if(!list.length){var p=document.createElement('p');p.textContent='目前沒有授權可查看的記事。';root.appendChild(p)}
  list.forEach(function(n){
   var article=document.createElement('article');article.className='note';
   var heading=document.createElement('strong');heading.textContent=String(n.title||'未命名記事');
   var date=document.createElement('div');date.className='sub';
   date.textContent='修改於 '+dateText(n.updatedAt)+'｜版本 '+Number(n.version||0);
   var content=document.createElement('div');content.className='body';content.textContent=String(n.content||'');
   article.append(heading,date,content);
   if(canWrite()){
    var edit=document.createElement('button');edit.type='button';edit.className='secondary';
    edit.textContent='編輯記事';
    edit.onclick=function(){openEditor(n)};article.appendChild(edit);
   }
   root.appendChild(article);
  });
 };
 var openEditor=function(note){
  if(!account||!canWrite()){status('目前帳號沒有修改權限。');return}
  editing=note||null;pendingSave=null;pendingDelete=null;
  byId('editorTitle').textContent=note?'編輯記事':'新增記事';
  byId('noteTitle').value=note?String(note.title||''):'';
  byId('noteContent').value=note?String(note.content||''):'';
  byId('deleteNote').hidden=!note||!canDelete();
  byId('editor').hidden=false;
  byId('noteTitle').focus();
 };
 var closeEditor=function(){byId('editor').hidden=true;editing=null;pendingSave=null;pendingDelete=null};
 var saveNote=function(){
  if(running||!account||!canWrite())return;
  var title=byId('noteTitle').value.trim(),content=byId('noteContent').value;
  if(!content.trim()){status('記事內容不能空白。');return}
  if(title.length>120||content.length>30000){status('記事長度超過限制。');return}
  var action=editing?'UPDATE_NOTE':'CREATE_NOTE';
  var params={title:title,content:content};
  if(editing){params.articleId=String(editing.articleId);params.expectedVersion=Number(editing.version)}
  else{params.scope=scope;if(scope==='SHARED')params.groupId=byId('groupId').value}
  var fingerprint=JSON.stringify([account,action,params]);
  // An ambiguous network error may mean Google committed even when the phone
  // received no ACK. Reuse the original operation ID for the SAME request.
  // Changing the request before reconciliation can create duplicate records.
  if(pendingSave&&pendingSave.fingerprint!==fingerprint){
   status('上一次儲存結果尚未確認，不能用新內容直接重送。請先複製草稿並重新讀取 Google 資料核對。');
   return;
  }
  if(!pendingSave)pendingSave={fingerprint:fingerprint,operationId:secureId()};
  params.operationId=pendingSave.operationId;
  running=true;byId('saveNote').disabled=true;status('正在儲存，請稍候……');
  remote(action,params,function(){
   running=false;byId('saveNote').disabled=false;
   closeEditor();status('已確認 Google 儲存成功。');refresh();
  },function(err){
   running=false;byId('saveNote').disabled=false;
   var code=String(err&&err.message||'REMOTE_REQUEST_FAILED');
   status(code.includes('VERSION_CONFLICT')
    ?'另一支手機已修改這則記事。你的文字仍保留在編輯畫面，請先複製，再重新讀取最新版。'
    :'儲存失敗；編輯內容仍留在畫面中，尚未同步。'+code);
  });
 };
 var deleteNote=function(){
  if(running||!account||!editing||!canDelete())return;
  if(!window.confirm('確定要刪除這則記事嗎？刪除後會保留異動紀錄。'))return;
  var fingerprint=JSON.stringify([account,String(editing.articleId),Number(editing.version)]);
  if(pendingDelete&&pendingDelete.fingerprint!==fingerprint){
   status('先前刪除結果尚未確認，請重新讀取核對。');return;
  }
  if(!pendingDelete)pendingDelete={fingerprint:fingerprint,operationId:secureId()};
  var params={operationId:pendingDelete.operationId,
   articleId:String(editing.articleId),expectedVersion:Number(editing.version)};
  running=true;byId('deleteNote').disabled=true;status('正在刪除……');
  remote('DELETE_NOTE',params,function(){
   running=false;byId('deleteNote').disabled=false;closeEditor();refresh();
  },function(err){
   running=false;byId('deleteNote').disabled=false;
   status('刪除確認未完成：可能已經刪除。再次按刪除會安全重試同一操作，或先重新讀取核對。'+
    String(err&&err.message||'REMOTE_REQUEST_FAILED'));
  });
 };
 var refresh=function(){
  if(running)return;
  if(!window.google||!google.script||!google.script.run){status('尚未部署到 Google Apps Script 測試環境');return}
  if(!account){status('請先完成 Google 帳號身分驗證。');return}
  var req={scope:scope};
  if(scope==='SHARED'){req.groupId=byId('groupId').value.trim();if(!req.groupId){status('請先選擇共用群組');return}}
  running=true;byId('refresh').disabled=true;status('正在透過 Google 驗證權限並讀取……');
  remote('LIST_NOTES',req,function(data){
   running=false;byId('refresh').disabled=false;showNotes(data);
  },function(err){
   running=false;byId('refresh').disabled=false;
   status('讀取失敗，資料未更動：'+String(err&&err.message||'UNKNOWN_ERROR'));
  });
 };
 byId('personal').onclick=function(){choose('PRIVATE')};
 byId('team').onclick=function(){choose('SHARED')};
 byId('refresh').onclick=refresh;
 byId('groupId').onchange=function(){
  if(!leaveEditor()){byId('groupId').value=activeGroup;return}
  activeGroup=byId('groupId').value;
  byId('newNote').disabled=!account||!canWrite();
  refresh();
 };
 byId('newNote').onclick=function(){openEditor(null)};
 byId('saveNote').onclick=saveNote;
 byId('cancelNote').onclick=leaveEditor;
 byId('deleteNote').onclick=deleteNote;
 if(window.google&&google.script&&google.script.run){
  google.script.run.withSuccessHandler(function(info){
   account=info&&typeof info.account==='string'?info.account.trim().toLowerCase():'';
   if(!account){byId('identity').textContent='Google 身分無法確認，已停用同步。';return}
   byId('identity').textContent='目前 Google 帳號：'+account;
   byId('newNote').disabled=false;refresh();
  }).withFailureHandler(function(){
   byId('identity').textContent='目前 Google 帳號：無法驗證（同步已停用）';
  }).gasWhoAmI();
 }else{
  byId('identity').textContent='尚未部署；這是隔離測試介面。';
 }
})();
</script></body></html>
